<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmavond QR Codes</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
            margin: 0;
        }

        h1 {
            text-align: center;
        }

        #tickets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
        }

        .ticket {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .ticket h2 {
            margin-top: 0;
        }

        .qr {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }

        .url {
            font-size: 11px;
            color: #777;
            word-break: break-all;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>🎬 Filmavond QR Codes</h1>

    <div id="tickets">
        Laden...
    </div>

    <script>
    const SUPABASE_URL = "https://vmkhgifrvwngoexfkdgt.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_5s3medx06EcIGSfqZAsvfA_BjQBYvDS";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const websiteURL = "https://472hjmvsmg-png.github.io/Filmavond-tickets/";

        async function loadTickets() {

            const container = document.getElementById("tickets");

            const { data: tickets, error } = await supabaseClient
                .from("tickets")
                .select("name, token")
                .order("id", { ascending: true });

            if (error) {
                container.innerHTML =
                    `<p class="error">Fout bij laden: ${error.message}</p>`;
                return;
            }

            container.innerHTML = "";

            tickets.forEach(ticket => {

                const ticketDiv = document.createElement("div");
                ticketDiv.className = "ticket";

                const qrDiv = document.createElement("div");
                qrDiv.className = "qr";

                const ticketURL =
                    websiteURL + "?token=" + encodeURIComponent(ticket.token);

                new QRCode(qrDiv, {
                    text: ticketURL,
                    width: 200,
                    height: 200
                });

                ticketDiv.innerHTML = `
                    <h2>${ticket.name}</h2>
                `;

                ticketDiv.appendChild(qrDiv);

                ticketDiv.innerHTML += `
                    <div class="url">${ticketURL}</div>
                `;

                container.appendChild(ticketDiv);
            });
        }

        loadTickets();
    </script>

</body>
</html>
