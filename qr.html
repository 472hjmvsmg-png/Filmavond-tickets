<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmavond QR Codes</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
            margin: 0;
        }

        h1 {
            text-align: center;
        }

        #status {
            text-align: center;
            margin: 20px;
        }

        #tickets {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .ticket {
            background: white;
            border-radius: 15px;
            padding: 25px;
            width: 260px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .ticket h2 {
            margin-top: 0;
        }

        .qr {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🎬 Filmavond QR Codes</h1>

    <div id="status">Tickets laden...</div>

    <div id="tickets"></div>

    <script>

const SUPABASE_URL = "https://vmkhgifrvwngoexfkdgt.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_5s3medx06EcIGSfqZAsvfA_BjQBYvDS";

        const websiteURL = "https://472hjmvsmg-png.github.io/Filmavond-tickets/";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function loadTickets() {

            const status = document.getElementById("status");
            const container = document.getElementById("tickets");

            const { data: tickets, error } = await supabaseClient
                .from("tickets")
                .select("id, name, token")
                .order("id", { ascending: true });

            if (error) {
                status.innerHTML =
                    '<span class="error">Fout: ' + error.message + '</span>';
                return;
            }

            if (!tickets || tickets.length === 0) {
                status.innerHTML = "Geen tickets gevonden.";
                return;
            }

            status.innerHTML = tickets.length + " ticket gevonden.";

            tickets.forEach(function(ticket) {

                const ticketDiv = document.createElement("div");
                ticketDiv.className = "ticket";

                const title = document.createElement("h2");
                title.textContent = ticket.name;

                const qrDiv = document.createElement("div");
                qrDiv.className = "qr";

                const ticketURL =
                    websiteURL + "?token=" + encodeURIComponent(ticket.token);

                ticketDiv.appendChild(title);
                ticketDiv.appendChild(qrDiv);

                container.appendChild(ticketDiv);

                new QRCode(qrDiv, {
                    text: ticketURL,
                    width: 200,
                    height: 200
                });
            });
        }

        loadTickets();

    </script>

</body>
</html>
