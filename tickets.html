<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filmavond Passes</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        /* =========================
           BEDIENING
           ========================= */

        .controls {
            position: sticky;
            top: 0;
            z-index: 100;

            padding: 18px;

            text-align: center;

            background: #090909;
            border-bottom: 1px solid #2b2b2b;
        }

        .print-button {
            border: 0;

            padding: 13px 25px;

            border-radius: 999px;

            background: #d6b36a;
            color: #111;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
        }

        .print-button:hover {
            background: #e3c27d;
        }

        /* =========================
           PRINT AREA
           ========================= */

        #printArea {
            padding: 40px 20px;
        }

        /*
         * Eén .sheet = één volledige A4.
         *
         * We verdelen A4 in drie gelijke
         * horizontale zones.
         */

        .sheet {
            width: 210mm;
            height: 297mm;

            margin: 0 auto 30px auto;

            background: white;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /*
         * Eén ticketgebied.
         *
         * 297 / 3 = 99 mm
         */

        .slot {
            width: 100%;
            height: 99mm;

            padding: 5mm;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        /* =========================
           VOORKANT
           ========================= */

        .front-pass {
            width: 100%;
            height: 100%;

            display: grid;

            /*
             * Brede ticket:
             * veel ruimte links,
             * compact QR-vak rechts.
             */

            grid-template-columns: 1fr 45mm;

            position: relative;
            overflow: hidden;

            border-radius: 4mm;

            background:
                radial-gradient(
                    circle at 12% 20%,
                    rgba(214,179,106,0.12),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #1b1b1b,
                    #090909
                );

            border: 0.4mm solid rgba(214,179,106,0.55);
        }

        .front-main {
            padding: 7mm 9mm;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .brand {
            color: #d6b36a;

            font-size: 3mm;
            font-weight: 900;

            letter-spacing: 1.1mm;
        }

        .small-number {
            position: absolute;

            right: 48mm;
            top: 7mm;

            color: rgba(255,255,255,0.3);

            font-size: 2mm;
            letter-spacing: 0.6mm;
        }

        .eyebrow {
            margin-top: 7mm;
            margin-bottom: 2mm;

            font-size: 2.1mm;
            font-weight: 800;

            letter-spacing: 0.7mm;

            color: rgba(255,255,255,0.42);
        }

        .pass-title {
            margin: 0;

            font-size: 9mm;
            line-height: 0.9;

            font-weight: 900;

            letter-spacing: -0.4mm;
        }

        .pass-title span {
            color: #d6b36a;
        }

        .name-block {
            margin-top: 4mm;
        }

        .name-label {
            font-size: 2mm;
            font-weight: 800;

            letter-spacing: 0.7mm;

            color: rgba(255,255,255,0.4);

            margin-bottom: 1.5mm;
        }

        .name {
            font-size: 5.5mm;
            line-height: 1;

            font-weight: 800;
        }

        .bottom {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 5mm;
        }

        .permanent {
            display: inline-flex;

            align-items: center;

            gap: 1.5mm;

            padding: 2mm 3mm;

            border: 0.3mm solid rgba(214,179,106,0.5);

            border-radius: 999px;

            color: #d6b36a;

            font-size: 1.8mm;
            font-weight: 900;

            letter-spacing: 0.35mm;
        }

        .footer-text {
            font-size: 1.7mm;

            color: rgba(255,255,255,0.3);

            letter-spacing: 0.35mm;
        }

        /* =========================
           QR GEDEELTE
           ========================= */

        .front-side {
            background:
                linear-gradient(
                    160deg,
                    #e8dec8,
                    #d4c199
                );

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 4mm;

            color: #111;
        }

        .qr-label {
            font-size: 1.9mm;
            font-weight: 900;

            letter-spacing: 0.5mm;

            margin-bottom: 1.8mm;

            color: rgba(17,17,17,0.6);

            text-align: center;
        }

        .qr {
            padding: 2.5mm;

            background: white;

            border-radius: 2.5mm;

            box-shadow:
                0 1.5mm 4mm rgba(0,0,0,0.14);
        }

        /*
         * Zowel img als canvas ondersteunen.
         */

        .qr img,
        .qr canvas {
            display: block;

            width: 31mm !important;
            height: 31mm !important;
        }

        .scan-title {
            margin-top: 2.5mm;

            font-size: 2mm;
            font-weight: 900;

            letter-spacing: 0.3mm;

            text-align: center;
        }

        .scan-text {
            margin-top: 1mm;

            max-width: 35mm;

            font-size: 1.7mm;

            line-height: 1.35;

            color: rgba(17,17,17,0.55);

            text-align: center;
        }

        /* =========================
           ACHTERKANT
           ========================= */

        .back-pass {
            width: 100%;
            height: 100%;

            position: relative;
            overflow: hidden;

            border-radius: 4mm;

            border: 0.4mm solid rgba(214,179,106,0.55);

            background:
                radial-gradient(
                    circle at 80% 20%,
                    rgba(214,179,106,0.12),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #181818,
                    #080808
                );

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;
        }

        .back-pass::before {
            content: "";

            position: absolute;

            width: 75mm;
            height: 75mm;

            border-radius: 50%;

            border: 0.3mm solid rgba(214,179,106,0.07);

            box-shadow:
                0 0 0 10mm rgba(214,179,106,0.025),
                0 0 0 20mm rgba(214,179,106,0.015);
        }

        .back-brand {
            position: relative;

            color: #d6b36a;

            font-size: 2.7mm;
            font-weight: 900;

            letter-spacing: 1mm;

            margin-bottom: 4mm;
        }

        .back-title {
            position: relative;

            margin: 0;

            font-size: 8mm;
            line-height: 0.9;

            font-weight: 900;

            letter-spacing: -0.3mm;
        }

        .back-title span {
            color: #d6b36a;
        }

        .back-tagline {
            position: relative;

            margin-top: 3.5mm;

            font-size: 2.5mm;

            font-weight: 800;

            letter-spacing: 0.65mm;

            color: rgba(255,255,255,0.85);
        }

        .back-description {
            position: relative;

            max-width: 80mm;

            margin-top: 3mm;

            color: rgba(255,255,255,0.45);

            font-size: 2mm;

            line-height: 1.45;
        }

        .back-line {
            position: relative;

            width: 35mm;
            height: 0.25mm;

            background: #d6b36a;

            margin: 4mm 0;
        }

        .back-footer {
            position: relative;

            color: rgba(255,255,255,0.3);

            font-size: 1.8mm;

            font-weight: 800;

            letter-spacing: 0.5mm;
        }

        /* =========================
           FOUT
           ========================= */

        .error {
            color: red;

            padding: 40px;

            text-align: center;
        }

        /* =========================
           PRINT
           ========================= */

        @media print {

            @page {
                size: A4 portrait;
                margin: 0;
            }

            html,
            body {
                margin: 0;
                padding: 0;

                background: white;
            }

            .controls {
                display: none !important;
            }

            #printArea {
                padding: 0;
            }

            .sheet {
                width: 210mm;
                height: 297mm;

                margin: 0;

                break-after: page;
                page-break-after: always;
            }

            .sheet:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .front-pass,
            .back-pass {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>

<div class="controls">

    <button
        class="print-button"
        onclick="window.print()"
    >
        🖨 Print Filmavond Passes
    </button>

</div>


<div id="printArea">
    Laden...
</div>


<script>

    /*
     * =========================
     * SUPABASE
     * =========================
     */

const SUPABASE_URL = "https://vmkhgifrvwngoexfkdgt.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_5s3medx06EcIGSfqZAsvfA_BjQBYvDS";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /*
     * =========================
     * TICKET URL
     * =========================
     *
     * We bepalen automatisch waar
     * index.html van dezelfde website staat.
     *
     * Daardoor hoef je de GitHub Pages
     * URL hier niet meer handmatig in te vullen.
     */

    const websiteURL =
        new URL(
            "index.html",
            window.location.href
        ).href;


    /*
     * =========================
     * TICKETS LADEN
     * =========================
     */

    async function loadTickets() {

        const printArea =
            document.getElementById(
                "printArea"
            );


        try {

            const {
                data: tickets,
                error
            } =
                await supabaseClient
                    .from("tickets")
                    .select(
                        "id, name, token"
                    )
                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );


            if (error) {
                throw error;
            }


            if (
                !tickets ||
                tickets.length === 0
            ) {

                printArea.innerHTML = `
                    <div class="error">
                        Geen tickets gevonden.
                    </div>
                `;

                return;
            }


            printArea.innerHTML = "";


            /*
             * Elke groep = 3 tickets.
             *
             * Voorzijde:
             * A4 met 3 voorkanten.
             *
             * Achterzijde:
             * A4 met 3 achterkanten.
             */

            for (
                let i = 0;
                i < tickets.length;
                i += 3
            ) {

                const group =
                    tickets.slice(
                        i,
                        i + 3
                    );


                /*
                 * =====================
                 * VOORKANT A4
                 * =====================
                 */

                const frontSheet =
                    document.createElement(
                        "div"
                    );

                frontSheet.className =
                    "sheet";


                group.forEach(
                    function(ticket) {

                        const slot =
                            document.createElement(
                                "div"
                            );

                        slot.className =
                            "slot";


                        const front =
                            document.createElement(
                                "div"
                            );

                        front.className =
                            "front-pass";


                        /*
                         * Permanente QR-link
                         */

                        const ticketURL =
                            websiteURL +
                            "?token=" +
                            encodeURIComponent(
                                ticket.token
                            );


                        front.innerHTML = `

                            <div class="front-main">

                                <div>

                                    <div class="brand">
                                        FILMAVOND
                                    </div>


                                    <div class="eyebrow">
                                        PERSOONLIJKE TOEGANG
                                    </div>


                                    <h1 class="pass-title">
                                        FILMAVOND<br>
                                        <span>PASS</span>
                                    </h1>


                                    <div class="name-block">

                                        <div class="name-label">
                                            UITGEREIKT AAN
                                        </div>


                                        <div class="name">
                                            ${ticket.name}
                                        </div>

                                    </div>

                                </div>


                                <div class="bottom">

                                    <div class="permanent">
                                        ✦ PERMANENTE PASS
                                    </div>


                                    <div class="footer-text">
                                        PERSOONLIJK • NIET DELEN
                                    </div>

                                </div>

                            </div>


                            <div class="front-side">

                                <div class="qr-label">
                                    JOUW PERSOONLIJKE QR
                                </div>


                                <div class="qr"></div>


                                <div class="scan-title">
                                    SCAN VOOR DE ACTUELE FILMAVOND
                                </div>


                                <div class="scan-text">
                                    Bekijk de actuele film,
                                    datum, tijd en informatie online.
                                </div>

                            </div>

                        `;


                        /*
                         * QR-code maken
                         */

                        const qrContainer =
                            front.querySelector(
                                ".qr"
                            );


                        new QRCode(
                            qrContainer,
                            {
                                text:
                                    ticketURL,

                                width:
                                    220,

                                height:
                                    220,

                                correctLevel:
                                    QRCode.CorrectLevel.H
                            }
                        );


                        /*
                         * Ticketnummer
                         */

                        const number =
                            document.createElement(
                                "div"
                            );

                        number.className =
                            "small-number";


                        number.textContent =
                            "PASS #" +
                            String(
                                ticket.id
                            ).padStart(
                                3,
                                "0"
                            );


                        front.appendChild(
                            number
                        );


                        slot.appendChild(
                            front
                        );


                        frontSheet.appendChild(
                            slot
                        );

                    }
                );


                /*
                 * Lege plekken vullen
                 * als de laatste pagina
                 * minder dan 3 tickets heeft.
                 */

                while (
                    frontSheet.children.length < 3
                ) {

                    const emptySlot =
                        document.createElement(
                            "div"
                        );

                    emptySlot.className =
                        "slot";


                    frontSheet.appendChild(
                        emptySlot
                    );
                }


                printArea.appendChild(
                    frontSheet
                );


                /*
                 * =====================
                 * ACHTERKANT A4
                 * =====================
                 */

                const backSheet =
                    document.createElement(
                        "div"
                    );

                backSheet.className =
                    "sheet";


                group.forEach(
                    function() {

                        const slot =
                            document.createElement(
                                "div"
                            );

                        slot.className =
                            "slot";


                        const back =
                            document.createElement(
                                "div"
                            );

                        back.className =
                            "back-pass";


                        back.innerHTML = `

                            <div class="back-brand">
                                🎬 FILMAVOND
                            </div>


                            <h2 class="back-title">

                                YOUR NIGHT.<br>

                                <span>
                                    YOUR MOVIE.
                                </span>

                            </h2>


                            <div class="back-tagline">
                                YOUR PERMANENT PASS.
                            </div>


                            <div class="back-description">

                                Deze persoonlijke
                                Filmavond Pass blijft
                                geldig voor toekomstige
                                filmavonden.

                                Scan de QR-code op de
                                voorkant om altijd de
                                actuele filmavond te
                                bekijken.

                            </div>


                            <div class="back-line"></div>


                            <div class="back-footer">
                                FILMAVOND • EST. 2026
                            </div>

                        `;


                        slot.appendChild(
                            back
                        );


                        backSheet.appendChild(
                            slot
                        );

                    }
                );


                /*
                 * Lege plekken vullen.
                 */

                while (
                    backSheet.children.length < 3
                ) {

                    const emptySlot =
                        document.createElement(
                            "div"
                        );

                    emptySlot.className =
                        "slot";


                    backSheet.appendChild(
                        emptySlot
                    );
                }


                printArea.appendChild(
                    backSheet
                );
            }


        } catch (error) {

            console.error(error);

            printArea.innerHTML = `
                <div class="error">
                    Er ging iets mis bij het laden
                    van de tickets:<br><br>
                    ${error.message}
                </div>
            `;
        }
    }


    loadTickets();

</script>

</body>
</html>
