<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filmavond Passes</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        .controls {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 18px;
            text-align: center;
            background: #090909;
            border-bottom: 1px solid #2b2b2b;
        }

        .print-button {
            border: 0;
            padding: 13px 25px;
            border-radius: 999px;
            background: #d6b36a;
            color: #111;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .print-button:hover {
            background: #e3c27d;
        }

        #printArea {
            padding: 40px 20px;
        }

        /* Eén A4-pagina */
        .sheet {
            width: 210mm;
            height: 297mm;
            margin: 0 auto 30px auto;
            background: white;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* Eén helft van A4 */
        .slot {
            width: 100%;
            height: 148.5mm;

            padding: 8mm;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        /* =========================
           VOORKANT
           ========================= */

        .front-pass {
            width: 100%;
            height: 100%;

            display: grid;
            grid-template-columns: 1fr 55mm;

            position: relative;
            overflow: hidden;

            border-radius: 6mm;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(214,179,106,0.10),
                    transparent 27%
                ),
                linear-gradient(
                    145deg,
                    #1b1b1b,
                    #090909
                );

            border: 0.4mm solid rgba(214,179,106,0.5);
        }

        .front-main {
            padding: 11mm;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand {
            color: #d6b36a;
            font-size: 3.2mm;
            font-weight: 900;
            letter-spacing: 1.2mm;
        }

        .small-number {
            position: absolute;
            right: 60mm;
            top: 10mm;

            color: rgba(255,255,255,0.3);
            font-size: 2.3mm;
            letter-spacing: 0.7mm;
        }

        .eyebrow {
            margin-top: 9mm;
            margin-bottom: 3mm;

            font-size: 2.5mm;
            font-weight: 800;
            letter-spacing: 0.8mm;

            color: rgba(255,255,255,0.42);
        }

        .pass-title {
            margin: 0;

            font-size: 12mm;
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -0.5mm;
        }

        .pass-title span {
            color: #d6b36a;
        }

        .name-block {
            margin-top: 7mm;
        }

        .name-label {
            font-size: 2.3mm;
            font-weight: 800;
            letter-spacing: 0.8mm;
            color: rgba(255,255,255,0.4);
            margin-bottom: 1.5mm;
        }

        .name {
            font-size: 7mm;
            line-height: 1;
            font-weight: 800;
        }

        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8mm;
        }

        .permanent {
            display: inline-flex;
            align-items: center;
            gap: 2mm;

            padding: 2.5mm 3.5mm;

            border: 0.3mm solid rgba(214,179,106,0.5);
            border-radius: 999px;

            color: #d6b36a;

            font-size: 2.2mm;
            font-weight: 900;
            letter-spacing: 0.4mm;
        }

        .footer-text {
            font-size: 1.9mm;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.4mm;
        }

        /* QR-GEDEELTE */

        .front-side {
            background:
                linear-gradient(
                    160deg,
                    #e8dec8,
                    #d4c199
                );

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 7mm;

            color: #111;
        }

        .qr-label {
            font-size: 2.2mm;
            font-weight: 900;
            letter-spacing: 0.6mm;

            margin-bottom: 3mm;

            color: rgba(17,17,17,0.6);
            text-align: center;
        }

        .qr {
            padding: 3mm;
            background: white;
            border-radius: 3mm;

            box-shadow:
                0 2mm 5mm rgba(0,0,0,0.12);
        }

        .qr img {
            display: block;
            width: 37mm !important;
            height: 37mm !important;
        }

        .scan-title {
            margin-top: 4mm;

            font-size: 2.7mm;
            font-weight: 900;
            letter-spacing: 0.4mm;

            text-align: center;
        }

        .scan-text {
            margin-top: 2mm;

            max-width: 38mm;

            font-size: 2.1mm;
            line-height: 1.45;

            color: rgba(17,17,17,0.55);
            text-align: center;
        }

        /* =========================
           ACHTERKANT
           ========================= */

        .back-pass {
            width: 100%;
            height: 100%;

            position: relative;
            overflow: hidden;

            border-radius: 6mm;

            border: 0.4mm solid rgba(214,179,106,0.5);

            background:
                radial-gradient(
                    circle at 80% 20%,
                    rgba(214,179,106,0.12),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #181818,
                    #080808
                );

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .back-pass::before {
            content: "";

            position: absolute;

            width: 100mm;
            height: 100mm;

            border-radius: 50%;

            border: 0.3mm solid rgba(214,179,106,0.07);

            box-shadow:
                0 0 0 12mm rgba(214,179,106,0.025),
                0 0 0 24mm rgba(214,179,106,0.015);
        }

        .back-brand {
            position: relative;

            color: #d6b36a;

            font-size: 3.2mm;
            font-weight: 900;
            letter-spacing: 1.2mm;

            margin-bottom: 9mm;
        }

        .back-title {
            position: relative;

            margin: 0;

            font-size: 11mm;
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -0.4mm;
        }

        .back-title span {
            color: #d6b36a;
        }

        .back-tagline {
            position: relative;

            margin-top: 6mm;

            font-size: 3.2mm;
            font-weight: 800;
            letter-spacing: 0.8mm;

            color: rgba(255,255,255,0.85);
        }

        .back-description {
            position: relative;

            max-width: 95mm;

            margin-top: 5mm;

            color: rgba(255,255,255,0.45);

            font-size: 2.5mm;
            line-height: 1.6;
        }

        .back-line {
            position: relative;

            width: 50mm;
            height: 0.3mm;

            background: #d6b36a;

            margin: 7mm 0;
        }

        .back-footer {
            position: relative;

            color: rgba(255,255,255,0.3);

            font-size: 2mm;
            font-weight: 800;
            letter-spacing: 0.6mm;
        }

        /* =========================
           FOUT
           ========================= */

        .error {
            color: red;
            padding: 40px;
            text-align: center;
        }

        /* =========================
           PRINT
           ========================= */

        @media print {

            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                background: white;
            }

            .controls {
                display: none !important;
            }

            #printArea {
                padding: 0;
            }

            .sheet {
                width: 210mm;
                height: 297mm;

                margin: 0;

                break-after: page;
                page-break-after: always;
            }

            .sheet:last-child {
                break-after: auto;
                page-break-after: auto;
            }

            .front-pass,
            .back-pass {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>

<div class="controls">

    <button
        class="print-button"
        onclick="window.print()"
    >
        🖨 Print Filmavond Passes
    </button>

</div>


<div id="printArea">
    Laden...
</div>


<script>

    /*
     * Gebruik exact dezelfde gegevens
     * als in je werkende index.html
     */

    const SUPABASE_URL = "https://vmkhgifrvwngoexfkdgt.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_5s3medx06EcIGSfqZAsvfA_BjQBYvDS";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const websiteURL = "https://472hjmvsmg-png.github.io/Filmavond-tickets/";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    async function loadTickets() {

        const printArea =
            document.getElementById("printArea");


        const {
            data: tickets,
            error
        } =
            await supabaseClient
                .from("tickets")
                .select("id, name, token")
                .order("id", {
                    ascending: true
                });


        if (error) {

            printArea.innerHTML = `
                <div class="error">
                    Fout: ${error.message}
                </div>
            `;

            return;
        }


        printArea.innerHTML = "";


        /*
         * Twee personen per A4.
         */

        for (
            let i = 0;
            i < tickets.length;
            i += 2
        ) {

            const group =
                tickets.slice(i, i + 2);


            /*
             * =====================
             * VOORKANT
             * =====================
             */

            const frontSheet =
                document.createElement("div");

            frontSheet.className =
                "sheet";


            group.forEach(function(ticket) {

                const slot =
                    document.createElement("div");

                slot.className =
                    "slot";


                const front =
                    document.createElement("div");

                front.className =
                    "front-pass";


                const ticketURL =
                    websiteURL +
                    "?token=" +
                    encodeURIComponent(
                        ticket.token
                    );


                front.innerHTML = `

                    <div class="front-main">

                        <div>

                            <div class="brand">
                                FILMAVOND
                            </div>


                            <div class="eyebrow">
                                PERSOONLIJKE TOEGANG
                            </div>


                            <h1 class="pass-title">

                                FILMAVOND<br>

                                <span>
                                    PASS
                                </span>

                            </h1>


                            <div class="name-block">

                                <div class="name-label">
                                    UITGEREIKT AAN
                                </div>


                                <div class="name">
                                    ${ticket.name}
                                </div>

                            </div>

                        </div>


                        <div class="bottom">

                            <div class="permanent">
                                ✦ PERMANENTE PASS
                            </div>


                            <div class="footer-text">
                                PERSOONLIJK • NIET DELEN
                            </div>

                        </div>

                    </div>


                    <div class="front-side">

                        <div class="qr-label">
                            JOUW PERSOONLIJKE QR
                        </div>


                        <div class="qr"></div>


                        <div class="scan-title">
                            SCAN VOOR DE ACTUELE FILMAVOND
                        </div>


                        <div class="scan-text">
                            Bekijk de actuele film,
                            datum, tijd en informatie online.
                        </div>

                    </div>

                `;


                /*
                 * QR-code
                 */

                const qrContainer =
                    front.querySelector(".qr");


                new QRCode(
                    qrContainer,
                    {
                        text: ticketURL,

                        width: 175,
                        height: 175,

                        correctLevel:
                            QRCode.CorrectLevel.H
                    }
                );


                /*
                 * Ticketnummer
                 */

                const number =
                    document.createElement("div");

                number.className =
                    "small-number";

                number.textContent =
                    "PASS #" +
                    String(ticket.id)
                        .padStart(3, "0");


                front.appendChild(number);


                slot.appendChild(front);

                frontSheet.appendChild(slot);

            });


            /*
             * Als er één persoon overblijft,
             * blijft de tweede helft leeg.
             */

            while (
                frontSheet.children.length < 2
            ) {

                const emptySlot =
                    document.createElement(
                        "div"
                    );

                emptySlot.className =
                    "slot";

                frontSheet.appendChild(
                    emptySlot
                );
            }


            printArea.appendChild(
                frontSheet
            );


            /*
             * =====================
             * ACHTERKANT
             * =====================
             */

            const backSheet =
                document.createElement("div");

            backSheet.className =
                "sheet";


            group.forEach(function() {

                const slot =
                    document.createElement("div");

                slot.className =
                    "slot";


                const back =
                    document.createElement("div");

                back.className =
                    "back-pass";


                back.innerHTML = `

                    <div class="back-brand">
                        🎬 FILMAVOND
                    </div>


                    <h2 class="back-title">

                        YOUR NIGHT.<br>

                        <span>
                            YOUR MOVIE.
                        </span>

                    </h2>


                    <div class="back-tagline">
                        YOUR PERMANENT PASS.
                    </div>


                    <div class="back-description">

                        Deze persoonlijke
                        Filmavond Pass blijft
                        geldig voor toekomstige
                        filmavonden.

                        Scan de QR-code op de
                        voorkant om altijd de
                        actuele filmavond te
                        bekijken.

                    </div>


                    <div class="back-line"></div>


                    <div class="back-footer">
                        FILMAVOND • EST. 2026
                    </div>

                `;


                slot.appendChild(back);

                backSheet.appendChild(slot);

            });


            /*
             * Tweede helft leegmaken
             * wanneer er slechts één
             * ticket in de groep zit.
             */

            while (
                backSheet.children.length < 2
            ) {

                const emptySlot =
                    document.createElement(
                        "div"
                    );

                emptySlot.className =
                    "slot";

                backSheet.appendChild(
                    emptySlot
                );
            }


            printArea.appendChild(
                backSheet
            );
        }
    }


    loadTickets();

</script>

</body>
</html>
