<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmavond Passes</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        .controls {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #111;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .print-button {
            border: none;
            background: #e50914;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        #tickets {
            padding: 40px 20px;
        }

        .pass {
            width: 900px;
            max-width: 100%;
            min-height: 340px;
            margin: 0 auto 35px auto;

            display: flex;

            background: #f7f4ee;
            border-radius: 20px;
            overflow: hidden;

            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        }

        .pass-main {
            flex: 1;
            padding: 42px;
            position: relative;
        }

        .brand {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #e50914;
            margin-bottom: 50px;
        }

        .pass-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 9px;
        }

        .pass-title {
            font-size: 44px;
            line-height: 1;
            font-weight: 900;
            margin-bottom: 38px;
            letter-spacing: -1px;
        }

        .name-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 6px;
        }

        .name {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .permanent {
            display: inline-block;
            padding: 9px 13px;
            border: 1px solid #111;
            border-radius: 50px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
        }

        .divider {
            width: 1px;
            border-left: 2px dashed #b8b3aa;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            background: #111;
            border-radius: 50%;
            left: -15px;
        }

        .divider::before {
            top: -14px;
        }

        .divider::after {
            bottom: -14px;
        }

        .pass-side {
            width: 250px;
            background: #ebe7df;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .qr {
            background: white;
            padding: 11px;
            border-radius: 11px;
            margin-bottom: 18px;
        }

        .scan-title {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 7px;
        }

        .scan-text {
            max-width: 175px;
            text-align: center;
            color: #777;
            font-size: 10px;
            line-height: 1.45;
        }

        .error {
            color: #ff5555;
            text-align: center;
            padding: 50px;
        }

        @media print {

            @page {
                size: A4;
                margin: 10mm;
            }

            body {
                background: white;
            }

            .controls {
                display: none;
            }

            #tickets {
                padding: 0;
            }

            .pass {
                width: 100%;
                max-width: none;
                margin: 0 auto 12mm auto;
                box-shadow: none;

                break-inside: avoid;
                page-break-inside: avoid;
            }
        }

        @media (max-width: 700px) {

            .pass {
                flex-direction: column;
            }

            .divider {
                display: none;
            }

            .pass-side {
                width: 100%;
            }

            .pass-title {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="controls">
        <button class="print-button" onclick="window.print()">
            🖨 Print alle Filmavond Passes
        </button>
    </div>

    <div id="tickets">
        Laden...
    </div>

    <script>

const SUPABASE_URL = "https://vmkhgifrvwngoexfkdgt.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_5s3medx06EcIGSfqZAsvfA_BjQBYvDS";

        const websiteURL = "https://472hjmvsmg-png.github.io/Filmavond-tickets/";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function loadTickets() {

            const container = document.getElementById("tickets");

            const { data: tickets, error } =
                await supabaseClient
                    .from("tickets")
                    .select("id, name, token")
                    .order("id", { ascending: true });

            if (error) {
                container.innerHTML =
                    `<div class="error">Fout bij laden: ${error.message}</div>`;
                return;
            }

            container.innerHTML = "";

            tickets.forEach(function(ticket) {

                const ticketURL =
                    websiteURL + "?token=" +
                    encodeURIComponent(ticket.token);

                const pass = document.createElement("div");
                pass.className = "pass";

                const main = document.createElement("div");
                main.className = "pass-main";

                main.innerHTML = `
                    <div class="brand">
                        🎬 FILMAVOND
                    </div>

                    <div class="pass-label">
                        OFFICIËLE PERSOONLIJKE TOEGANG
                    </div>

                    <div class="pass-title">
                        FILMAVOND<br>
                        PASS
                    </div>

                    <div class="name-label">
                        OP NAAM VAN
                    </div>

                    <div class="name">
                        ${ticket.name}
                    </div>

                    <div class="permanent">
                        ✓ PERMANENTE TOEGANG
                    </div>
                `;

                const divider = document.createElement("div");
                divider.className = "divider";

                const side = document.createElement("div");
                side.className = "pass-side";

                const qr = document.createElement("div");
                qr.className = "qr";

                new QRCode(qr, {
                    text: ticketURL,
                    width: 170,
                    height: 170,
                    correctLevel: QRCode.CorrectLevel.H
                });

                const scanTitle = document.createElement("div");
                scanTitle.className = "scan-title";
                scanTitle.textContent = "SCAN VOOR DE ACTUELE FILMAVOND";

                const scanText = document.createElement("div");
                scanText.className = "scan-text";
                scanText.textContent =
                    "Gebruik deze persoonlijke QR-code om de actuele film, datum en tijd te bekijken.";

                side.appendChild(qr);
                side.appendChild(scanTitle);
                side.appendChild(scanText);

                pass.appendChild(main);
                pass.appendChild(divider);
                pass.appendChild(side);

                container.appendChild(pass);
            });
        }

        loadTickets();

    </script>

</body>
</html>
