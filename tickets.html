<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmavond Passes</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top, #242424 0%, #111 42%, #080808 100%);
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        /* PRINT BUTTON */
        .controls {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 18px;
            text-align: center;
            background: rgba(8, 8, 8, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .print-button {
            border: 0;
            padding: 13px 25px;
            border-radius: 999px;
            background: #d6b36a;
            color: #111;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        .print-button:hover {
            background: #e4c47d;
        }

        /* TICKETS CONTAINER */

        #tickets {
            padding: 60px 20px;
        }

        /* MAIN PASS */

        .pass {
            width: 920px;
            max-width: 100%;
            min-height: 390px;
            margin: 0 auto 42px;

            display: grid;
            grid-template-columns: 1fr 285px;

            position: relative;
            overflow: hidden;

            border: 1px solid rgba(214,179,106,0.45);
            border-radius: 22px;

            background:
                radial-gradient(circle at 20% 20%, rgba(214,179,106,0.08), transparent 28%),
                linear-gradient(145deg, #191919, #0e0e0e);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.04);
        }

        /* DECORATIVE LIGHT */

        .pass::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            right: 100px;
            top: -320px;

            border: 1px solid rgba(214,179,106,0.08);
            box-shadow:
                0 0 0 35px rgba(214,179,106,0.02),
                0 0 0 70px rgba(214,179,106,0.015);

            pointer-events: none;
        }

        /* LEFT SIDE */

        .pass-main {
            padding: 42px 48px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand {
            color: #d6b36a;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .small-number {
            font-size: 9px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 2px;
        }

        .hero {
            margin-top: 38px;
        }

        .eyebrow {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.43);
            margin-bottom: 13px;
        }

        .pass-title {
            font-size: 56px;
            line-height: 0.92;
            font-weight: 900;
            letter-spacing: -2px;
            margin: 0;
        }

        .pass-title span {
            color: #d6b36a;
        }

        .name-block {
            margin-top: 42px;
        }

        .name-label {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.42);
            margin-bottom: 8px;
        }

        .name {
            font-size: 30px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .bottom {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-top: 35px;
        }

        .permanent {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 9px 13px;

            border: 1px solid rgba(214,179,106,0.4);
            border-radius: 999px;

            color: #d6b36a;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.8px;
        }

        .footer-text {
            font-size: 8px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* DIVIDER */

        .divider {
            position: absolute;
            right: 285px;
            top: 22px;
            bottom: 22px;
            width: 1px;
            border-left: 1px dashed rgba(255,255,255,0.16);
        }

        .divider::before,
        .divider::after {
            content: "";

            position: absolute;
            width: 25px;
            height: 25px;

            background: #111;
            border: 1px solid rgba(214,179,106,0.20);
            border-radius: 50%;

            left: -14px;
        }

        .divider::before {
            top: -13px;
        }

        .divider::after {
            bottom: -13px;
        }

        /* QR SIDE */

        .pass-side {
            position: relative;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background:
                linear-gradient(
                    160deg,
                    #e7dcc2 0%,
                    #d5c29a 100%
                );

            color: #111;
        }

        .qr-label {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2.5px;
            margin-bottom: 16px;
            color: rgba(17,17,17,0.65);
        }

        .qr {
            padding: 13px;
            background: #fff;
            border-radius: 15px;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.16);
        }

        .qr img {
            display: block;
        }

        .scan-title {
            margin-top: 18px;

            font-size: 12px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 1.3px;
        }

        .scan-text {
            max-width: 190px;
            margin-top: 8px;

            font-size: 9px;
            line-height: 1.5;
            text-align: center;

            color: rgba(17,17,17,0.58);
        }

        .qr-footer {
            position: absolute;
            bottom: 19px;
            left: 0;
            right: 0;

            text-align: center;

            font-size: 7px;
            font-weight: 900;
            letter-spacing: 2px;

            color: rgba(17,17,17,0.35);
        }

        .error {
            color: #ff6969;
            text-align: center;
            padding: 50px;
        }

        /* MOBILE */

        @media (max-width: 720px) {

            .pass {
                grid-template-columns: 1fr;
            }

            .divider {
                display: none;
            }

            .pass-side {
                min-height: 300px;
            }

            .pass-title {
                font-size: 45px;
            }

            .bottom {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }
        }

        /* PRINT */

        @media print {

            @page {
                size: A4;
                margin: 10mm;
            }

            body {
                background: white;
            }

            .controls {
                display: none;
            }

            #tickets {
                padding: 0;
            }

            .pass {
                width: 100%;
                max-width: none;
                min-height: 350px;

                margin: 0 auto 12mm;

                box-shadow:
                    none;

                break-inside: avoid;
                page-break-inside: avoid;

                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>

    <div class="controls">
        <button class="print-button" onclick="window.print()">
            🖨 Print alle Filmavond Passes
        </button>
    </div>

    <div id="tickets">
        Laden...
    </div>

    <script>

const SUPABASE_URL = "https://vmkhgifrvwngoexfkdgt.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_5s3medx06EcIGSfqZAsvfA_BjQBYvDS";

        const websiteURL = "https://472hjmvsmg-png.github.io/Filmavond-tickets/";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function loadTickets() {

            const container = document.getElementById("tickets");

            const { data: tickets, error } =
                await supabaseClient
                    .from("tickets")
                    .select("id, name, token")
                    .order("id", { ascending: true });

            if (error) {
                container.innerHTML =
                    `<div class="error">Fout bij laden: ${error.message}</div>`;
                return;
            }

            container.innerHTML = "";

            tickets.forEach(function(ticket) {

                const ticketURL =
                    websiteURL + "?token=" +
                    encodeURIComponent(ticket.token);

                const pass = document.createElement("div");
                pass.className = "pass";

                const main = document.createElement("div");
                main.className = "pass-main";

                main.innerHTML = `
                    <div>
                        <div class="top">

                            <div class="brand">
                                FILMAVOND
                            </div>

                            <div class="small-number">
                                PASS #${String(ticket.id).padStart(3, "0")}
                            </div>

                        </div>

                        <div class="hero">

                            <div class="eyebrow">
                                PERSOONLIJKE TOEGANG
                            </div>

                            <h1 class="pass-title">
                                FILMAVOND<br>
                                <span>PASS</span>
                            </h1>

                        </div>

                        <div class="name-block">

                            <div class="name-label">
                                UITGEREIKT AAN
                            </div>

                            <div class="name">
                                ${ticket.name}
                            </div>

                        </div>
                    </div>

                    <div class="bottom">

                        <div class="permanent">
                            <span>✦</span>
                            PERMANENTE PASS
                        </div>

                        <div class="footer-text">
                            Persoonlijk • Niet delen
                        </div>

                    </div>
                `;

                const divider = document.createElement("div");
                divider.className = "divider";

                const side = document.createElement("div");
                side.className = "pass-side";

                const qrLabel = document.createElement("div");
                qrLabel.className = "qr-label";
                qrLabel.textContent = "JOUW PERSOONLIJKE QR";

                const qr = document.createElement("div");
                qr.className = "qr";

                new QRCode(qr, {
                    text: ticketURL,
                    width: 175,
                    height: 175,
                    correctLevel: QRCode.CorrectLevel.H
                });

                const scanTitle = document.createElement("div");
                scanTitle.className = "scan-title";
                scanTitle.textContent =
                    "SCAN VOOR DE ACTUELE FILMAVOND";

                const scanText = document.createElement("div");
                scanText.className = "scan-text";
                scanText.textContent =
                    "Bekijk de actuele film, datum, tijd en alle informatie online.";

                const qrFooter = document.createElement("div");
                qrFooter.className = "qr-footer";
                qrFooter.textContent = "FILMAVOND • OFFICIËLE PASS";

                side.appendChild(qrLabel);
                side.appendChild(qr);
                side.appendChild(scanTitle);
                side.appendChild(scanText);
                side.appendChild(qrFooter);

                pass.appendChild(main);
                pass.appendChild(divider);
                pass.appendChild(side);

                container.appendChild(pass);
            });
        }

        loadTickets();

    </script>

</body>
</html>
