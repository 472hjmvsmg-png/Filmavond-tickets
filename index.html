<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijn Filmavond Ticket</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top, #252525 0%, #101010 45%, #070707 100%);

            color: white;
        }

        .page {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .brand {
            text-align: center;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #d6b36a;
            margin: 10px 0 25px;
        }

        .ticket {
            overflow: hidden;

            border: 1px solid rgba(214,179,106,0.35);
            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    #1b1b1b,
                    #101010
                );

            box-shadow:
                0 25px 60px rgba(0,0,0,0.45);
        }

        .header {
            padding: 26px 24px 20px;
        }

        .small-label {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
        }

        .name {
            font-size: 29px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .personal {
            font-size: 11px;
            color: #999;
        }

        .poster-wrapper {
            padding: 0 18px;
        }

        .poster {
            width: 100%;
            display: block;

            border-radius: 16px;

            max-height: 560px;
            object-fit: cover;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.5);
        }

        .movie-info {
            padding: 25px 24px 30px;
        }

        .movie-label {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #d6b36a;
            margin-bottom: 9px;
        }

        .movie-title {
            font-size: 31px;
            line-height: 1.05;
            font-weight: 900;
            margin-bottom: 25px;
        }

        .details {
            display: flex;
            gap: 35px;
            margin-bottom: 25px;
        }

        .detail-label {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.38);
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 800;
        }

        .message {
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);

            color: #bbb;
            font-size: 13px;
            line-height: 1.5;
        }

        .valid {
            margin-top: 25px;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 14px;

            border: 1px solid rgba(214,179,106,0.35);
            border-radius: 999px;

            color: #d6b36a;

            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.7px;
        }

        .footer {
            text-align: center;
            margin-top: 18px;

            color: rgba(255,255,255,0.25);

            font-size: 8px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .error {
            text-align: center;
            padding: 50px 20px;
            color: #ff6b6b;
        }

        @media (max-width: 380px) {

            .movie-title {
                font-size: 27px;
            }

            .name {
                font-size: 25px;
            }

            .details {
                gap: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="brand">
            🎬 FILMAVOND
        </div>

        <div id="ticket" class="ticket">
            Laden...
        </div>

        <div class="footer">
            PERSOONLIJK TICKET • NIET DELEN
        </div>

    </div>

    <script>

        const SUPABASE_URL = "https://vmkhgifrvwngoexfkdgt.supabase.co/";
    const SUPABASE_KEY = "sb_publishable_5s3medx06EcIGSfqZAsvfA_BjQBYvDS";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function loadTicket() {

            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");

            const ticketElement = document.getElementById("ticket");

            if (!token) {
                ticketElement.innerHTML = `
                    <div class="error">
                        Geen geldig ticket gevonden.
                    </div>
                `;
                return;
            }

            const { data: ticket, error: ticketError } =
                await supabaseClient
                    .from("tickets")
                    .select("*")
                    .eq("token", token)
                    .single();

            if (ticketError || !ticket) {
                ticketElement.innerHTML = `
                    <div class="error">
                        Ticket niet gevonden.
                    </div>
                `;
                return;
            }

            const { data: event, error: eventError } =
                await supabaseClient
                    .from("event_settings")
                    .select("*")
                    .order("id", { ascending: false })
                    .limit(1)
                    .single();

            if (eventError || !event) {
                ticketElement.innerHTML = `
                    <div class="error">
                        Filmavond niet gevonden.
                    </div>
                `;
                return;
            }

            ticketElement.innerHTML = `

                <div class="header">

                    <div class="small-label">
                        PERSOONLIJK TICKET
                    </div>

                    <div class="name">
                        ${ticket.name}
                    </div>

                    <div class="personal">
                        Dit is jouw persoonlijke Filmavond Pass.
                    </div>

                </div>

                <div class="poster-wrapper">

                    <img
                        class="poster"
                        src="${event.poster_url || ""}"
                        alt="${event.movie_title || "Filmavond"} poster"
                        onerror="this.style.display='none';"
                    >

                </div>

                <div class="movie-info">

                    <div class="movie-label">
                        DE ACTUELE FILMAVOND
                    </div>

                    <div class="movie-title">
                        ${event.movie_title || "Filmavond"}
                    </div>

                    <div class="details">

                        <div>
                            <div class="detail-label">
                                DATUM
                            </div>

                            <div class="detail-value">
                                ${event.event_date || "-"}
                            </div>
                        </div>

                        <div>
                            <div class="detail-label">
                                AANVANG
                            </div>

                            <div class="detail-value">
                                ${event.event_time || "-"}
                            </div>
                        </div>

                    </div>

                    ${
                        event.message
                        ? `
                        <div class="message">
                            ${event.message}
                        </div>
                        `
                        : ""
                    }

                    <div class="valid">
                        ✓ TICKET GELDIG
                    </div>

                </div>

            `;
        }

        loadTicket();

    </script>

</body>
</html>
