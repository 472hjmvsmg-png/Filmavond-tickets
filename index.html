<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filmavond Ticket</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .ticket {
            width: 90%;
            max-width: 500px;
            background: #222;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            margin: 25px 0;
        }

        .message {
            color: #aaa;
        }

        .error {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

    <div class="ticket">
        <h1>🎬 Filmavond</h1>

        <div id="content">
            Ticket wordt geladen...
        </div>
    </div>

    <script>

        // ==========================================
        // JOUW SUPABASE GEGEVENS
        // ==========================================

        const SUPABASE_URL = "https://vmkhgifrvwngoexfkdgt.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_5s3medx06EcIGSfqZAsvfA_BjQBYvDS";

        // ==========================================
        // SUPABASE VERBINDING
        // ==========================================

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        // ==========================================
        // TOKEN UIT DE URL HALEN
        // ==========================================

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        const content = document.getElementById("content");

        // ==========================================
        // CONTROLEREN OF ER EEN TOKEN IS
        // ==========================================

        if (!token) {

            content.innerHTML = `
                <p class="error">
                    Geen geldige ticketcode gevonden.
                </p>
            `;

        } else {

            loadTicket();

        }

        // ==========================================
        // TICKET UIT SUPABASE OPHALEN
        // ==========================================

        async function loadTicket() {

            const { data, error } = await supabaseClient
                .from("tickets")
                .select("*")
                .eq("token", token)
                .single();

     if (error) {

    console.error(error);

    content.innerHTML = `
        <p class="error">
            Er is een fout opgetreden:
        </p>
        <p>
            ${error.message}
        </p>
    `;

    return;
}

            content.innerHTML = `
                <div class="name">
                    ${data.name}
                </div>

                <p class="message">
                    Welkom bij de filmavond! 🍿
                </p>
            `;
        }

    </script>

</body>
</html>
